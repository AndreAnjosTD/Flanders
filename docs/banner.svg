<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Flanders: a neighbourly voice for task delegation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="55%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <text x="80" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="88" font-weight="700" fill="#ffffff" letter-spacing="7">FLANDERS</text>

  <text x="84" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="28" fill="#a9d6e5">A neighbourly voice for task delegation</text>

  <text x="84" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" fill="#7ee787">Okily dokily!</text>

  <g transform="translate(880,150)" fill="url(#wave)">
    <rect x="0"   y="-18" width="10" height="36"  rx="5"/>
    <rect x="24"  y="-40" width="10" height="80"  rx="5"/>
    <rect x="48"  y="-62" width="10" height="124" rx="5"/>
    <rect x="72"  y="-34" width="10" height="68"  rx="5"/>
    <rect x="96"  y="-52" width="10" height="104" rx="5"/>
    <rect x="120" y="-22" width="10" height="44"  rx="5"/>
    <rect x="144" y="-44" width="10" height="88"  rx="5"/>
    <rect x="168" y="-14" width="10" height="28"  rx="5"/>
  </g>
</svg>
